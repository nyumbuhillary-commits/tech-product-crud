<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tech Product Showcase - CRUD</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Segoe UI, Arial, sans-serif; margin: 0; background: #f3f5f9; color: #1f2937; }
    header { background: #1e3a8a; color: #fff; padding: 18px 24px; }
    header h1 { margin: 0; font-size: 1.4rem; }
    header p { margin: 4px 0 0; opacity: .8; font-size: .9rem; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    h2 { margin-top: 0; font-size: 1.1rem; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    label { display: flex; flex-direction: column; font-size: .85rem; font-weight: 600; gap: 4px; }
    input, textarea { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
    .full { grid-column: 1 / -1; }
    .actions { grid-column: 1 / -1; display: flex; gap: 8px; }
    button { border: 0; border-radius: 6px; padding: 9px 16px; cursor: pointer; font-weight: 600; }
    .primary { background: #2563eb; color: #fff; }
    .secondary { background: #e5e7eb; }
    .edit { background: #f59e0b; color: #fff; padding: 5px 10px; }
    .del { background: #dc2626; color: #fff; padding: 5px 10px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e5e7eb; white-space: nowrap; }
    td.desc { white-space: normal; min-width: 200px; }
    th { background: #f1f5f9; }
    #msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; display: none; }
    #msg.ok { display: block; background: #dcfce7; color: #166534; }
    #msg.err { display: block; background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <header>
    <h1>Tech Product Showcase</h1>
    <p>ICT251 Activity 4 - Node.js + Express + SQLite CRUD</p>
  </header>
  <main>
    <div id="msg"></div>

    <section class="card">
      <h2 id="formTitle">Add a new product</h2>
      <form id="productForm">
        <input type="hidden" id="id" />
        <label>Product name *<input id="product_name" required maxlength="150" /></label>
        <label>Brand<input id="brand" maxlength="100" /></label>
        <label>Category<input id="category" maxlength="80" /></label>
        <label>Price ($)<input id="price" type="number" step="0.01" min="0" value="0" /></label>
        <label>Stock<input id="stock" type="number" step="1" min="0" value="0" /></label>
        <label class="full">Description<textarea id="description" rows="2"></textarea></label>
        <div class="actions">
          <button type="submit" class="primary" id="saveBtn">Save product</button>
          <button type="button" class="secondary" id="cancelBtn" style="display:none">Cancel edit</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Products (<span id="count">0</span>)</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>Name</th><th>Brand</th><th>Category</th><th>Price</th><th>Stock</th><th>Description</th><th>Updated</th><th>Actions</th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
